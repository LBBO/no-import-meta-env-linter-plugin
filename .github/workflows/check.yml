name: Check

on:
  pull_request:
  push:
    branches:
      - main
  workflow_call:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: pnpm exec tsc --noEmit
      - run: pnpm test
